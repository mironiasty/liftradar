  .popup table { border-collapse: collapse; margin: 6px 0; }
  .popup td { padding: 1px 10px 1px 0; vertical-align: top; }

_cm": null, "valley_cm": null, "fresh_cm": null, "lifts_open": 0, "lifts_total": 9, "slopes_open": null, "slopes_total": null, "open_km": 0.0, "total_km": 29, "avalanche": null, "avalanche_label": null, "updated": "22.10.2026 07:39", "errors": [], "json": "json/at/werfenweng.json"}, {"id": "zauchensee-flachauwinkl", "name": "Zauchensee - Flachauwinkl", "lat": 47.2906, "lon": 13.4525, "status": "closed", "mountain_cm": null, "valley_cm": null, "fresh_cm": null, "lifts_open": 0, "lifts_total": 16, "slopes_open": null, "slopes_total": null, "open_km": null, "total_km": null, "avalanche": null, "avalanche_label": null, "updated": "25.10.2026 00:33", "errors": [], "json": "json/at/zauchensee-flachauwinkl.json"}];
const STATUS = {
  open: { label: "open", color: "var(--open)" },
  closed: { label: "closed", color: "var(--closed)" },
  no_report: { label: "no report yet", color: "var(--none)" },
  unknown: { label: "unknown / error", color: "var(--err)" },
};
const css = getComputedStyle(document.documentElement);
const color = (status) => css.getPropertyValue(STATUS[status].color.slice(4, -1)).trim();

const map = L.map("map", { zoomSnap: 0.5 });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 17,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const show = (value, unit = "") => (value === null || value === undefined ? "–" : `${value}${unit}`);
const pair = (a, b, unit = "") => (a === null && b === null ? "–" : `${show(a)}/${show(b)}${unit}`);

function popup(r) {
  const rows = [
    ["Status", STATUS[r.status].label],
    ["Mountain", show(r.mountain_cm, " cm")],
    ["Valley", show(r.valley_cm, " cm")],
    ["Fresh", show(r.fresh_cm, " cm")],
    ["Lifts", pair(r.lifts_open, r.lifts_total)],
    ["Slopes", pair(r.slopes_open, r.slopes_total)],
    ["Slope km", pair(r.open_km, r.total_km, " km")],
    ["Avalanche", r.avalanche ? `${r.avalanche} (${r.avalanche_label})` : "–"],
    ["Report", show(r.updated)],
  ];
  return `<div class="popup"><h3>${esc(r.name)}</h3><table>${rows
    .map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    ${r.errors.length ? `<div class="err">${esc(r.errors.join("; "))}</div>` : ""}
    <a href="${esc(r.json)}">JSON</a></div>`;
}

const layers = {};
for (const status of Object.keys(STATUS)) layers[status] = L.layerGroup().addTo(map);
for (const r of resorts) {
  const icon = L.divIcon({
    className: "",
    html: `<div class="pin ${r.status}" style="background:${color(r.status)}">${r.status === "open" ? show(r.lifts_open) : ""}</div>`,
    iconSize: null,
    iconAnchor: [11, 11],
  });
  L.marker([r.lat, r.lon], { icon, title: r.name, riseOnHover: true })
    .bindPopup(popup(r))
    .addTo(layers[r.status]);
}
map.fitBounds(resorts.map((r) => [r.lat, r.lon]), { padding: [30, 30] });

const filters = document.getElementById("filters");
for (const [status, { label }] of Object.entries(STATUS)) {
  const count = resorts.filter((r) => r.status === status).length;
  if (!count) continue;
  const item = document.createElement("label");
  item.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${color(status)}"></span>${label} (${count})`;
  item.querySelector("input").addEventListener("change", (e) =>
    e.target.checked ? layers[status].addTo(map) : layers[status].remove());
  filters.append(item);
}
