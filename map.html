<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map – LiftRadar</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { height: 100%; }
  body { font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  /* Same name and logo as index.html, a size smaller; they link back to the table. */
  h1 { margin: 0; }
  header .pill { margin-left: auto; }
  /* Phones: the table link next to the name, the update time underneath. */
  @media (max-width: 640px) {
    header > .muted { order: 1; flex-basis: 100%; }
    .pill .long { display: none; }
  }
  .muted { font-size: .85rem; }
  .map-wrap { flex: 1; position: relative; min-height: 300px; }
  #map { position: absolute; inset: 0; }

  /* Options panel over the map; collapsed to its title on small screens. */
  .panel { position: absolute; top: 10px; right: 10px; z-index: 1000; width: min(300px, calc(100% - 70px));
    background: var(--bg); color: var(--fg); border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.22); font-size: .85rem; }
  .panel:not([open]) { width: auto; }
  .panel summary { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px;
    cursor: pointer; font-weight: 600; list-style: none; user-select: none; }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary::after { content: ""; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 2px 2px 0;
    transform: rotate(45deg); margin: -3px 2px 0 14px; transition: transform .15s; }
  .panel[open] summary::after { transform: rotate(-135deg); margin-top: 3px; }
  .panel-body { padding: 0 12px 12px; }
  .panel h2 { margin: 4px 0 6px; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .panel h2:not(:first-child) { margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--chip); border-color: transparent; color: var(--fg); font-weight: 500; }
  .chip:focus-visible, .seg button:focus-visible, .panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--c); }
  .chip[aria-pressed="true"] .dot { background: var(--c); }
  #metrics .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg { display: inline-flex; margin-top: 8px; padding: 2px; border-radius: 8px; background: var(--chip); }
  .seg button { padding: 3px 12px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .seg button:disabled { cursor: default; opacity: .45; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: .78rem; }
  .pin { display: flex; align-items: center; justify-content: center; border-radius: 11px; height: 22px;
    min-width: 22px; padding: 0 5px; box-sizing: border-box; color: #fff; font: 600 11px/1 system-ui, sans-serif;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); white-space: nowrap; transform: translate(-50%, -50%); }
  /* Resort popup: laid out like a resort card in the phone table. */
  .leaflet-popup-content { width: 264px; margin: 14px 16px; font: 14px/1.4 system-ui, sans-serif; }
  .popup .head { display: flex; align-items: baseline; gap: 8px; padding-right: 14px; }
  .popup .name { flex: 1; min-width: 0; color: var(--fg); font-size: 1rem; font-weight: 600; text-decoration: none; }
  .popup .name:hover { color: var(--accent); text-decoration: underline; }
  .popup .where { margin-top: 2px; color: var(--muted); font-size: .82rem; }
  .status-pill { display: inline-flex; flex: none; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--fg); font-size: .72rem; font-weight: 500; white-space: nowrap; }
  .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .popup .values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; margin-top: 12px;
    font-variant-numeric: tabular-nums; }
  .popup .label { margin-bottom: 2px; color: var(--muted); font-size: .66rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .popup .sub { color: var(--muted); font-size: .78rem; }
  .popup .fresh { color: var(--accent); font-weight: 600; }
  .popup .meter { width: 100%; max-width: 64px; margin-top: 5px; }
  .popup .danger { display: flex; align-items: center; gap: 6px; }
  .popup .err { margin-top: 10px; }
  .popup .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
  .popup .foot a { margin-left: auto; font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1><a class="brand compact" href="./">
    <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
      <mask id="logo-window"><rect width="32" height="32" fill="#fff"/><rect x="10.5" y="15" width="11" height="5.5" rx="1.3" fill="#000"/></mask>
      <path d="M2 9 L30 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="16" cy="7" r="1.8" fill="currentColor"/>
      <path d="M16 7 V12" stroke="currentColor" stroke-width="2"/>
      <rect x="8" y="12" width="16" height="15.5" rx="3.6" style="fill: var(--accent)" mask="url(#logo-window)"/>
    </svg>
    <span class="name"><b>LiftRadar</b><small>Status of ski resorts</small></span>
  </a></h1>
  <span class="muted"><span id="updated">Loading…</span> &middot; <a href="sources.html">Sources</a></span>
  <a class="pill" href="./">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></svg>
    <span>Table<span class="long"> of all resorts</span></span>
  </a>
</header>
<div class="map-wrap">
  <div id="map" role="region" aria-label="Map of ski resorts"></div>
  <details class="panel" id="panel" open>
    <summary>Map options</summary>
    <div class="panel-body">
      <h2 id="status-title">Resorts</h2>
      <div class="chips" id="filters" role="group" aria-labelledby="status-title"></div>
      <h2 id="label-title">Number on markers</h2>
      <div class="chips" id="metrics" role="group" aria-labelledby="label-title"></div>
      <div class="seg" id="mode" role="group" aria-label="Open or total"></div>
      <p class="hint" id="hint"></p>
    </div>
  </details>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/map.js"></script>
</body>
</html>
