name: Deploy site

# The site (this branch) and the data (the "data" branch, published by
# liftradar-fetcher) are combined and deployed to Cloudflare (the Worker "liftradar").
# Runs when the site changes, and after every data update (dispatched by the data
# branch's deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Combine site and data
        run: |
          mkdir _site
          cp -R site/index.html site/about.html site/map.html site/resort.html site/sources.html site/stats.html site/404.html site/_headers site/assets _site/
          for part in json history schema; do cp -R "data/$part" _site/; done

      # Scripts keep their top-level names (esbuild leaves them alone when not bundling):
      # the pages share them from common.js. A failure here only costs a few kilobytes,
      # so it doesn't hold back new data: the unminified files stay valid.
      - name: Minify scripts and styles
        continue-on-error: true
        run: |
          npm ci --prefix site
          site/node_modules/.bin/esbuild _site/assets/*.js _site/assets/*.css --minify --outdir=_site/assets --allow-overwrite

      # The same data without its indentation; only the deployed copy, the data branch
      # stays readable. A failure leaves the file as it was.
      - name: Compact the resort index
        continue-on-error: true
        run: |
          jq -c . _site/json/index.json > index.min.json
          mv index.min.json _site/json/index.json

      # Without a version in the URL, a new page can run with the previous version's
      # scripts from a cache on the way.
      - name: Version the asset links
        run: |
          version=$(git -C site rev-parse --short HEAD)
          sed -i -E "s#(assets/[a-z]+\.(js|css))\"#\1?v=$version\"#g" _site/*.html
          grep -o 'assets/[^"]*' _site/*.html

      # An assets-only Worker (wrangler.jsonc), uploaded from here: the site is combined
      # from two branches, so Cloudflare's own Git builds can't make it.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: deploy --config site/wrangler.jsonc --assets _site
