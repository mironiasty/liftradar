name: Deploy site

# The site (this branch) and the data (the "data" branch, published by
# snow-fetcher) are combined and deployed to GitHub Pages. Runs when the site
# changes, and after every data update (dispatched by the data branch's
# deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Combine site and data
        run: |
          mkdir _site
          cp -R site/index.html site/map.html site/sources.html site/assets _site/
          for part in json archive schema; do cp -R "data/$part" _site/; done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
