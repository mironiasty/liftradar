name: Deploy site

# The site (this branch) and the data (the "data" branch, published by
# liftradar-fetcher) are combined and deployed to Cloudflare (the Worker "liftradar").
# Runs when the site changes, and after every data update (dispatched by the data
# branch's deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: site

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: data
          path: data

      # The ski tiles (README "Ski tiles"), built weekly by ski.yml into a release asset, next to the
      # data for the build. Without it (not built yet, or GitHub failing) the site goes out without
      # /ski/, which apps handle.
      - name: Add the ski tiles
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ski-latest -R "$GITHUB_REPOSITORY" -p ski.tar.gz -D ski-archive
          tar xzf ski-archive/ski.tar.gz -C data
          jq -c '{build, counts}' data/ski/v1/meta.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # esbuild for the build, and the MCP server's packages, bundled into the Worker by wrangler at
      # the deploy (README "MCP").
      - name: Install packages
        run: npm ci --prefix site

      # The site and the data combined into _site/, as `npm run build` does locally (README
      # "Running locally"): the 3D engine, the translated pages, the sitemap, minified, the asset
      # links versioned.
      - name: Build
        run: node site/scripts/build.mjs --data data --out _site

      # An assets-only Worker (wrangler.jsonc), uploaded from here: the site is combined
      # from two branches, so Cloudflare's own Git builds can't make it.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: deploy --config site/wrangler.jsonc --assets _site
