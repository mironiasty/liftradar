# Version updates: once a month, one pull request per ecosystem, no release younger than a week.
# Security updates (on in the repository's settings) come as soon as there is an advisory, whatever
# the schedule and cooldown say: what matters most is @modelcontextprotocol/sdk, behind the public /mcp.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: npm

  # The workflows' actions are pinned to commits; this moves the pins and their "# vX.Y.Z" comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: actions
