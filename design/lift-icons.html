<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift icons</title>
<style>
  /* The site's colours (assets/style.css), light and dark side by side. */
  .light { --bg: #f8fbff; --fg: #14365e; --muted: #587194; --line: #dbe4ef; --accent: #0b5cad; --sky: #e3ecf7;
    --shadow: 0 1px 2px rgba(20,54,94,.05), 0 6px 20px rgba(20,54,94,.06); }
  .dark { --bg: #26476e; --fg: #f3f7fc; --muted: #b6c8dd; --line: #3a5c84; --accent: #a9cdf6; --sky: #3d6290;
    --shadow: 0 1px 2px rgba(5,20,40,.12), 0 6px 20px rgba(5,20,40,.14); }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  .theme { background: var(--sky); color: var(--fg); padding: 20px 16px; }
  .meta { color: var(--muted); }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin: 0 0 12px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .sheet figure { margin: 0; padding: 14px 8px 10px; border-radius: 12px; background: var(--bg); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
  .sheet svg { width: 64px; height: 64px; color: var(--fg); }
  .sizes { display: flex; gap: 14px; align-items: end; }
  .sizes svg { color: var(--fg); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--bg); border-radius: var(--radius, 14px); box-shadow: var(--shadow); padding: 16px 18px; }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px; gap: 8px 12px; align-items: center; font-size: .9rem; }
  .bars .n { font-variant-numeric: tabular-nums; text-align: right; }
  .bars .lbl { display: flex; align-items: center; gap: 8px; }
  .bars .lbl svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }

  /* Variant A: lines only. */
  .ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  /* Variant B: two-tone, the cabin in the accent as in the logo and the loader. */
  /* Shapes inside <use> take no selectors from here, only inherited values: hence the variables. */
  .duo .ico { --b-fill: var(--accent); --b-stroke: var(--accent); --w-fill: var(--bg); --w-stroke: none; }
  .duo .bars .lbl svg { color: var(--fg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Gondola: one cable, a grip, a rounded cabin with a wide window (the logo's cabin). -->
    <symbol id="gondola" viewBox="0 0 24 24">
      <path d="M2 8.5 22 4.5"/><circle class="dot" style="fill:currentColor;stroke:none" cx="12" cy="6.5" r="1.4"/><path d="M12 6.5V10"/>
      <rect class="body" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor)" x="6.5" y="10" width="11" height="10.5" rx="3"/>
      <rect class="win" style="fill:var(--w-fill,none);stroke:var(--w-stroke,currentColor)" x="8.8" y="12.3" width="6.4" height="3.4" rx="1"/>
    </symbol>
    <!-- Cable car: two cables, a carriage on both, a big square cabin with two windows. -->
    <symbol id="cable_car" viewBox="0 0 24 24">
      <path d="M2 7 22 3M2 9.5 22 5.5"/>
      <path d="M9 7.4l6-1.2M12 7v3.2"/>
      <rect class="body" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor)" x="4.5" y="10.2" width="15" height="10.8" rx="1.6"/>
      <rect class="win" style="fill:var(--w-fill,none);stroke:var(--w-stroke,currentColor)" x="6.6" y="12.4" width="4.6" height="3.6" rx=".6"/>
      <rect class="win" style="fill:var(--w-fill,none);stroke:var(--w-stroke,currentColor)" x="12.8" y="12.4" width="4.6" height="3.6" rx=".6"/>
    </symbol>
    <!-- Chairlift: one cable, the hanger bending back into the chair, seat and footrest. -->
    <symbol id="chairlift" viewBox="0 0 24 24">
      <path d="M2 8.5 22 4.5"/><circle class="dot" style="fill:currentColor;stroke:none" cx="13" cy="6.3" r="1.4"/>
      <path d="M13 6.3V10H8v8h8.5"/>
      <path class="body" d="M8 16.2h8.5v1.8H8z" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor);stroke-width:1"/>
      <path d="M16.5 18l1.5 3h2.5"/>
    </symbol>
    <!-- Drag lift: the cable overhead, a rope trailing down from its grip to a level T-bar, the slope under it. -->
    <symbol id="drag_lift" viewBox="0 0 24 24">
      <path d="M2 6.5 22 3"/><circle class="dot" style="fill:currentColor;stroke:none" cx="14" cy="4.4" r="1.4"/>
      <path d="M14 4.4 11.5 15"/>
      <path class="body" d="M7.5 15h8" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor);stroke-width:2.2"/>
      <path d="M2 21.5 22 18"/>
    </symbol>
    <!-- Carpet: a person standing on a belt that runs up a gentle slope. -->
    <symbol id="carpet" viewBox="0 0 24 24">
      <circle class="dot" style="fill:currentColor;stroke:none" cx="11" cy="3.6" r="1.7"/><path d="M11 6.4v4.4M11 10.8l-2 3.4M11 10.8l2 3M8.3 8.6h5.4"/>
      <path class="body" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor)" d="M3.5 16.4 20.5 13a1.8 1.8 0 0 1 .7 3.5L4.2 19.9a1.8 1.8 0 0 1-.7-3.5z"/>
    </symbol>
    <!-- Funicular: a steep track, a solid car (in both variants: outlined, its windows were too small) with two windows. -->
    <symbol id="funicular" viewBox="0 0 24 24">
      <path d="M2 20 22 10"/>
      <path class="body" style="fill:var(--b-fill,currentColor);stroke:var(--b-stroke,currentColor)" d="M4 16 18 9V4L4 11z"/>
      <path class="win" style="fill:var(--w-fill,var(--bg));stroke:none" d="M6.2 11.6l4.6-2.3v2.4l-4.6 2.3zM12.2 8.6l4.6-2.3v2.4l-4.6 2.3z"/>
      <circle class="dot" style="fill:currentColor;stroke:none" cx="6.5" cy="16.5" r="1.2"/><circle class="dot" style="fill:currentColor;stroke:none" cx="15.5" cy="12" r="1.2"/>
    </symbol>
    <!-- Other: a lift tower, the cable running over the sheaves at the ends of its crossarm. -->
    <symbol id="other" viewBox="0 0 24 24">
      <path d="M2 6.6 22 4.6"/>
      <circle class="body" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor)" cx="8" cy="6.9" r="1.1"/><circle class="body" style="fill:var(--b-fill,none);stroke:var(--b-stroke,currentColor)" cx="16" cy="6.1" r="1.1"/>
      <path d="M6.5 8.6h11M10.2 21 11.4 8.6M13.8 21 12.6 8.6M9 21h6"/>
    </symbol>
  </defs>
</svg>

<div class="theme light"><div class="wrap">
<h1>Ikony wyciągów — szkic</h1>
<p class="meta">24×24, linia 1,7 px, kolor z <code>currentColor</code>. Wariant A: same linie. Wariant B: kabina w kolorze akcentu, jak w logo i w animacji ładowania.</p>

<div class="out"></div>
</div></div>
<div class="theme dark"><div class="wrap"><div class="out"></div></div></div>

<script>
  const TYPES = [
    ["gondola", "Gondole", 9, 12], ["cable_car", "Koleje linowe", 1, 2], ["chairlift", "Wyciągi krzesełkowe", 14, 18],
    ["drag_lift", "Wyciągi orczykowe", 6, 11], ["carpet", "Taśmy", 2, 4], ["funicular", "Koleje szynowe", 0, 1],
    ["other", "Inne", 1, 1],
  ];
  const icon = (id, size) =>
    `<svg class="ico" viewBox="0 0 24 24"${size ? ` width="${size}" height="${size}"` : ""} aria-hidden="true"><use href="#${id}"/></svg>`;
  const variant = (cls, title) => `
    <section class="${cls}">
      <h2>${title}</h2>
      <div class="sheet">${TYPES.map(([id, name]) => `<figure>${icon(id)}<figcaption>${id}</figcaption></figure>`).join("")}</div>
      <div class="row">
        <div class="card"><h2>Wyciągi według typu</h2><div class="bars">${TYPES.map(([id, name, o, n]) =>
          `<span class="lbl">${icon(id)}${name}</span><span class="n">${o}/${n}</span><span class="meter"><i style="width:${(100 * o) / n}%"></i></span>`).join("")}</div></div>
        <div class="card"><h2>Rozmiary: 16 · 20 · 24 · 32</h2>${TYPES.map(([id]) =>
          `<div class="sizes" style="margin-bottom:8px">${[16, 20, 24, 32].map((s) => icon(id, s)).join("")}</div>`).join("")}</div>
      </div>
    </section>`;
  for (const o of document.querySelectorAll(".out")) o.innerHTML = variant("line", "A — linie") + variant("duo", "B — dwa kolory");
</script>
</body>
</html>
