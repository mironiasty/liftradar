<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The social preview (assets/og.png, the pages' og:image): the logo's cabin, cable and peaks, large.
       Rendered to PNG with headless Chrome (DEVELOPMENT.md "Social preview"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08498c"/>
      <stop offset="1" stop-color="#1470c8"/>
    </linearGradient>
    <mask id="window">
      <rect width="1200" height="630" fill="#fff"/>
      <rect x="896" y="236" width="168" height="84" rx="24" fill="#000"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- Peaks -->
  <path fill="#5f8fd1" d="M0 500 L230 420 L380 470 L520 390 L700 480 V630 H0z"/>
  <path fill="#86aee3" d="M380 630 L760 330 L820 400 L900 360 L1200 520 V630z"/>
  <path fill="#fff" d="M760 330 L700 380 L735 390 L760 370 L790 395 L820 400z"/>
  <path fill="#eaf2fc" d="M0 630 L180 560 L330 600 L520 540 L720 630z"/>
  <!-- Cable and cabin -->
  <path d="M590 130 L1200 40" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="980" cy="76" r="14" fill="#fff"/>
  <path d="M980 76 V200" stroke="#fff" stroke-width="12"/>
  <rect x="870" y="196" width="220" height="200" rx="44" fill="#fff" mask="url(#window)"/>
  <!-- Text -->
  <g font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="80" y="200" font-size="104" font-weight="800" letter-spacing="-2">LiftRadar</text>
    <text x="84" y="268" font-size="42" font-weight="500" fill-opacity="0.92">Status of ski resorts across Europe</text>
    <text x="84" y="330" font-size="30" font-weight="500" fill-opacity="0.75">Lifts · Slopes · Snow · Weather</text>
  </g>
  <text x="84" y="590" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b5cad">liftradar.eu</text>
</svg>
